<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Webpage Design</title>
    <link rel="icon" href="mahesh.jpeg">
    <link rel="stylesheet" href="styles.css">

    <!-- Ionicons CDN -->
    <script src="https://unpkg.com/ionicons@5.4.0/dist/ionicons.js"></script>
</head>

<body>

<div class="main">

    <!-- NAVBAR -->
    <div class="navbar">

        <div class="logo">
            <h2>Praroz</h2>
        </div>

        <div class="menu">
            <ul>
                <li><a href="#">HOME</a></li>
                <li><a href="#">ABOUT</a></li>
                <li><a href="#">SERVICE</a></li>
                <li><a href="#">DESIGN</a></li>
                <li><a href="#">CONTACT</a></li>
            </ul>
        </div>

        <div class="search">
            <input class="srch" type="search" placeholder="Search">
            <button class="btn">Search</button>
        </div>

    </div>

    <!-- CONTENT -->
    <div class="content">

        <h1>Web Design & <br><span>Development</span> Course</h1>

        <p class="part">
            Learn web design and development with HTML, CSS and JavaScript.
        </p>

        <button class="cn">JOIN US</button>

        <!-- LOGIN FORM -->
        <div class="form">

            <h2>Login Here</h2>

            <input type="email" placeholder="Enter Email">
            <input type="password" placeholder="Enter Password">

            <button class="btnn">Login</button>

            <p>Don't have an account?</p>
            <a href="#">Sign up</a>

            <p>Log in with</p>

            <!-- SOCIAL ICONS -->
            <div class="social-icons">

                <a href="#"><ion-icon name="logo-facebook"></ion-icon></a>
                <a href="#"><ion-icon name="logo-instagram"></ion-icon></a>
                <a href="#"><ion-icon name="logo-twitter"></ion-icon></a>
                <a href="#"><ion-icon name="logo-google"></ion-icon></a>
                <a href="#"><ion-icon name="logo-whatsapp"></ion-icon></a>
                <a href="#"><ion-icon name="logo-youtube"></ion-icon></a>

            </div>

        </div>

    </div>

</div>

</body>
</html>
